<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <table class="table">
        <thead>
            <tr>
                <th scope="col"></th>
                <th scope="col">Id</th>
                <th scope="col">Title</th>
                <th scope="col">Author</th>
                <th scope="col">Content</th>
            </tr>
        </thead>
        <tbody id="tbodyBlog">

        </tbody>
    </table>
    <div class="mb-3">
        <label for="txtTitle" class="form-label">Title</label>
        <input type="text" class="form-control" id="txtTitle">
    </div>
    <div class="mb-3">
        <label for="txtAuthor" class="form-label">Author</label>
        <input type="text" class="form-control" id="txtAuthor">
    </div>
    <div class="mb-3">
        <label for="txtContent" class="form-label">Content</label>
        <input type="text" class="form-control" id="txtContent">
    </div>
    <button type="button" id="btnSave" class="btn btn-primary">Save</button>
    <button type="button" id="btnCancel" class="btn btn-primary">Cancel</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"
        integrity="sha512-YuCuk5nNmVIUfKROKeV3fpZZ5Vt9vsnq8nExr5JwEJc2r1YDVmDfujcq373eHIzjqdxwCzoKpxngIaAdRUyg3A=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- <script src="js/jquery.min.js"></script> -->

    <script>
        $('#btnCancel').click(function () {
            clearControls();
        });

        $('#btnSave').click(function () {
            if (editId == null) {
                createBlog();
            }
            else {
                updateBlog();
            }
        });

        $(document).ready(function () {
            loadData();
        });

        // $(document).ready(function () {
        //     let blogList = localStorage.getItem('blogs');
        //     console.log(blogList);
        //     if (blogList == null) {
        //         blogList = [];
        //     }
        //     else {
        //         blogList = JSON.parse(blogList);
        //     }

        //     const blog = {
        //         title: 'title',
        //         author: 'author',
        //         content: 'content'
        //     };
        //     blogList.push(blog);
        //     const jsonStr = JSON.stringify(blogList);
        //     localStorage.setItem("blogs", jsonStr);
        // });

        function clearControls() {
            $('#txtTitle').val('');
            $('#txtAuthor').val('');
            $('#txtContent').val('');

            $('txtTitle').focus();
        }

        function uuidv4() {
            return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
                (+c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> +c / 4).toString(16)
            );
        }

        function createBlog() {
            const title = $('#txtTitle').val();
            const author = $('#txtAuthor').val();
            const content = $('#txtContent').val();

            let blogList = getData();

            const blog = {
                id: uuidv4(),
                title: title,
                author: author,
                content: content
            };
            blogList.push(blog);

            const jsonStr = JSON.stringify(blogList);
            localStorage.setItem("blogs", jsonStr);

            clearControls();

            alert('Record saved successfully.');

            loadData();
        }

        function updateBlog() {
            const title = $('#txtTitle').val();
            const author = $('#txtAuthor').val();
            const content = $('#txtContent').val();

            let blogList = getData();

            let blogItem = blogList.findIndex(x => x.id == editId);
            blogList[blogItem].title = title;
            blogList[blogItem].author = author;
            blogList[blogItem].content = content;

            const jsonStr = JSON.stringify(blogList);
            localStorage.setItem("blogs", jsonStr);

            clearControls();

            alert('Record updated successfully.');

            loadData();

            editId = null;
        }

        function loadData() {
            console.log('loadData');
            let blogList = getData();

            $('#tbodyBlog').html('');
            for (let i = 0; i < blogList.length; i++) {
                const blog = blogList[i];
                const trBlog = `<tr>
                                    <td>
                                        <button type="button" class="btn btn-primary btnEdit" data-blog-id="${blog.id}">Edit</button>
                                        <button type="button" class="btn btn-primary btnDelete" data-blog-id="${blog.id}">Delete</button>
                                    </td>
                                    <td>${i + 1}</td>
                                    <td>${blog.title}</td>
                                    <td>${blog.author}</td>
                                    <td>${blog.content}</td>
                                </tr>`;
                $('#tbodyBlog').append(trBlog);
            }
            bindEditButton();
            bindDeleteButton();
        }

        let editId = null;
        function bindEditButton() {
            $('.btnEdit').click(function () {
                let id = $(this).data('blog-id');
                console.log({ id });
                let blogList = getData();

                let retList = blogList.filter(x => x.id == id);
                let retItem = retList[0];
                $('#txtTitle').val(retItem.title);
                $('#txtAuthor').val(retItem.author);
                $('#txtContent').val(retItem.content);
                editId = retItem.id;
            });
        }

        function bindDeleteButton() {
            $('.btnDelete').click(function () {
                let result = confirm("Are you sure want to delet?");
                if (!result) {
                    return;
                }
                let id = $(this).data('blog-id');
                let blogList = getData();

                blogList = blogList.filter(x => x.id != id);
                const jsonStr = JSON.stringify(blogList);
                localStorage.setItem("blogs", jsonStr);

                clearControls();

                alert('Record deleted successfully.');

                loadData();
            });
        }

        function getData() {
            let blogList = localStorage.getItem('blogs');
            if (blogList == null) {
                blogList = [];
            }
            else {
                blogList = JSON.parse(blogList);
            }
            return blogList;
        }
    </script>

</body>

</html>
